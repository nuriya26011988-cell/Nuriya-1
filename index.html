<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="description" content="«Өткінші өмір – Қымбат сәт» әніне арналған интерактивті кинематографиялық веб-клип." />
  <title>Өткінші өмір – Қымбат сәт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="letterbox top" aria-hidden="true"></div>
  <div class="letterbox bottom" aria-hidden="true"></div>

  <main class="stage">
    <header class="title-card" id="titleCard">
      <p class="eyebrow">Ән · Веб-клип</p>
      <h1>Өткінші өмір</h1>
      <p class="subtitle">Қымбат сәт</p>
      <p class="hint">«Бастау» батырмасын басыңыз немесе әннің MP3 файлын жүктеңіз</p>
    </header>

    <section class="lyrics" aria-live="polite">
      <p class="section-label" id="sectionLabel"></p>
      <p class="line" id="lineA"></p>
      <p class="line" id="lineB"></p>
    </section>
  </main>

  <footer class="controls" role="toolbar" aria-label="Басқару панелі">
    <div class="progress" id="progress" role="slider" aria-label="Ойнату барысы" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="controls-row">
      <span class="time" id="timeNow">0:00</span>

      <div class="buttons">
        <button class="btn" id="restartBtn" type="button" aria-label="Қайта бастау">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          <span>Қайта бастау</span>
        </button>

        <button class="btn btn-primary" id="playBtn" type="button" aria-label="Бастау">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          <span id="playLabel">Бастау</span>
        </button>

        <label class="btn" for="fileInput" id="uploadBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          <span>MP3 жүктеу</span>
        </label>
        <input type="file" id="fileInput" accept="audio/*,.mp3" hidden />
      </div>

      <span class="time" id="timeTotal">0:00</span>
    </div>

    <p class="track-name" id="trackName">Әуенсіз режим · мәтін өз ырғағымен жүреді</p>
  </footer>

  <audio id="audio" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
