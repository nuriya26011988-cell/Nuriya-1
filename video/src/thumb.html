<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Caveat:wght@700&display=swap">
<style>html,body{margin:0;background:#000}svg{display:block;width:1280px;height:720px}</style></head>
<body><div id="out"></div>
<script src="kit.js"></script><script src="shots.js"></script><script src="style.js"></script>
<script>
/* YouTube covers: big outlined title on the left, big close-up of the hero on the right. */
const TF="Montserrat, 'Arial Black', sans-serif";
function title(lines){ // [{t,fill,size,y}]
  return '<!--T-->'+lines.map(l=>`<text x="${l.x||70}" y="${l.y}" font-family="${TF}" font-weight="900" font-size="${l.size}" fill="${l.fill}" stroke="#000" stroke-width="${l.size*.16}" paint-order="stroke" stroke-linejoin="round" transform="rotate(${l.rot||-3} ${l.x||70} ${l.y})" style="filter:drop-shadow(6px 8px 0 rgba(0,0,0,.55))">${l.t}</text>`).join('');
}
const MOUTH={ // local to bust: head centre (0,-330), r 240
  scared:`<path d="M-58,-232 C-58,-300 58,-300 58,-232 C58,-170 -58,-170 -58,-232Z" fill="#3b1212" stroke="${INK}" stroke-width="14"/><path d="M-34,-196 C-20,-222 20,-222 34,-196 C20,-186 -20,-186 -34,-196Z" fill="#e2574c"/><path d="M-40,-268 H40" stroke="#fff" stroke-width="12" stroke-linecap="round"/>`,
  worried:P('M-56,-212 q14,-18 28,0 t28,0 t28,0 t28,0',{w:14}),
  focus:P('M-40,-216 L44,-226',{w:15})
};
function bust(x,y,s,mood,look,extra=''){ // big hero close-up: shoulders in fur + head
  return G(`<path d="M-260,120 C-250,-60 -150,-120 0,-120 C150,-120 250,-60 260,120Z" fill="url(#furG)" stroke="${INK}" stroke-width="10"/>`+
    P('M-200,60 l10,24 M-120,0 l10,24 M-40,-60 l10,24 M60,-40 l10,24 M150,20 l10,24 M-150,-60 l10,24 M200,90 l8,20',{s:'#5e3b1d',w:6})+
    head(0,-330,240,mood,look,true)+G(MOUTH[mood]||'',{t:`translate(${look[0]*240},${mood==='scared'?30:45})`})+extra,{t:`translate(${x},${y}) scale(${s})`});
}
const drop=(x,y,s=1,c='#6ec3ff')=>`<path d="M${x},${y} q-${22*s},${40*s} 0,${52*s} q${22*s},-${12*s} 0,-${52*s}Z" fill="${c}" stroke="#000" stroke-width="${5*s}"/>`;
const T1=()=>caveInterior('M0,0 H760 C700,260 520,420 0,430Z',{seed:31})+rockFloor(980,'#3a3430')+
  `<filter id="eb" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="16"/></filter>`+
  `<ellipse cx="1690" cy="250" rx="60" ry="26" fill="#ff2d20" filter="url(#eb)"/><ellipse cx="1840" cy="250" rx="60" ry="26" fill="#ff2d20" filter="url(#eb)"/>`+
  `<path d="M1650,250 Q1690,222 1730,250 Q1690,272 1650,250Z M1800,250 Q1840,222 1880,250 Q1840,272 1800,250Z" fill="#ff6a4a"/>`+
  bust(1420,910,1.1,'scared',[-.12,0])+drop(1720,330,1.4)+drop(1130,380,1.1)+drop(1760,470,.9)+
  title([{t:'50 000 ЖЫЛ БҰРЫН',fill:'#ffd23f',size:74,y:200},{t:'ЖАҢБЫР',fill:'#fff',size:190,y:400},{t:'= ӨЛІМ',fill:'#ff3b30',size:190,y:600}]);
const T2=()=>caveInterior('M1300,980 C1260,520 1440,160 1700,150 C1900,140 1940,500 1940,980Z',{seed:9})+rockFloor(960,'#3a3430')+
  `<ellipse cx="1060" cy="780" rx="700" ry="420" fill="url(#glowG)"/>`+fire(1050,1000,1.5)+
  bust(1490,930,1.05,'focus',[-.18,.16],`<path d="M-200,-40 L-40,-110 L-30,-98 L-190,-28Z" fill="#f4ecd8" stroke="${INK}" stroke-width="6"/>`+hand(-190,-40,26)+hand(-50,-100,26))+
  title([{t:'ҮҢГІРДЕ',fill:'#fff',size:180,y:300},{t:'НЕ ІСТЕДІ?',fill:'#ffd23f',size:160,y:500},{t:'жаңбырлы күндер',fill:'#ff7a3a',size:70,y:640}]);
const T3=()=>stormSky()+`<path d="M0,862 C300,846 600,876 960,858 C1300,842 1600,868 1920,852 V1080 H0Z" fill="${C.groundW}" stroke="${INK}" stroke-width="6"/>`+grass(850,1090,900,['#6e6535','#857a40','#5a5230','#9a8c4c'],12)+
  `<rect class="x" width="1920" height="1080" fill="#fff" opacity=".18"/>`+P('M1500,0 L1430,190 L1500,205 L1390,430',{s:'#fff6b0',w:18})+
  bust(1420,910,1.1,'worried',[0,-.18])+drop(1130,330,1.3)+drop(1720,300,1.1)+rain(260,{op:.8,d:.5,col:'#dce6f0',w:4})+
  title([{t:'ЖАҢБЫР',fill:'#fff',size:200,y:330},{t:'ЖАУСА',fill:'#fff',size:200,y:540},{t:'НЕ ІСТЕР ЕДІҢ?',fill:'#ffd23f',size:96,y:700}]);
const TT=[{t:'ЖАҢБЫР ЖАУҒАНДА',fill:'#fff',size:86,y:330},{t:'ЕЖЕЛГІ АДАМДАР',fill:'#ffd23f',size:90,y:470},{t:'НЕ ІСТЕДІ?',fill:'#ff3b30',size:150,y:670}];
const T4=()=>T1().split('<!--T-->')[0].replace("bust(1420,910,1.1","bust(1560,910,1")+'<!--T-->'+title(TT).replace('<!--T-->','');
const T5=()=>T2().split('<!--T-->')[0]+'<!--T-->'+title([TT[0],TT[1],{...TT[2],fill:'#ff7a1a'}]).replace('<!--T-->','');
window.make=i=>{const [bg,tx]=[T1,T2,T3,T4,T5][i]().split('<!--T-->');document.getElementById('out').innerHTML=`<svg class="scn" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${DEFS2}<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter><g filter="url(#rough)">${bg}</g>${vignette(.45)}${tx}</svg>`;
  for(const a of document.getAnimations()){a.pause();a.currentTime=2500}};
</script></body></html>
