<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Sans:wght@400;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;width:1920px;height:1080px}
#stage svg{width:1920px;height:1080px;display:block}
#grain{position:absolute;inset:0;background:url(grain.png);mix-blend-mode:multiply;opacity:.35;pointer-events:none}
@keyframes flash{0%,100%{opacity:0}4%{opacity:.9}8%{opacity:0}12%{opacity:.7}20%{opacity:0}}
.flash{animation:flash 4s linear var(--w,0s) infinite both}
@keyframes heart{0%,100%{transform:scale(1)}10%{transform:scale(1.15)}20%{transform:scale(1)}}
.heart{animation:heart 1.6s ease-out infinite;transform-origin:50% 50%}
@keyframes runin{from{transform:translateX(1500px)}to{transform:translateX(700px)}}
.runin{animation:runin 4s ease-out both}
@keyframes twist{from{transform:translateX(0)}to{transform:translateX(-377px)}}
.twist{animation:twist 2.4s linear infinite}
.scn :is(.heart,.runin,.twist){transform-box:fill-box}
</style></head>
<body><div id="stage"></div><div id="grain"></div>
<script src="kit.js"></script>
<script src="shots.js"></script>
<script src="style.js"></script>
<script src="timeline.js"></script>
<script>
const stage=document.getElementById('stage');
let cur=-1,camG=null;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function renderAt(t){
  const sh=TIMELINE.shots; let i=sh.length-1; while(i>0&&sh[i].start>t)i--;
  const s=sh[i];
  if(i!==cur){cur=i;
    stage.innerHTML=`<svg class="scn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">${DEFS2}<filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter><rect width="1920" height="1080" fill="#fff"/><g filter="url(#rough)"><g id="cam">${SC[s.scene]()}</g></g><rect width="1920" height="1080" fill="url(#vgAll)"/><defs><radialGradient id="vgAll" cx="50%" cy="50%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a120a" stop-opacity=".35"/></radialGradient></defs></svg>`;
    camG=document.getElementById('cam');}
  const u=ease(Math.min(1,Math.max(0,(t-s.start)/(s.end-s.start))));
  const [a,b]=s.cam, x=a[0]+(b[0]-a[0])*u, y=a[1]+(b[1]-a[1])*u, w=a[2]+(b[2]-a[2])*u, k=1920/w;
  camG.setAttribute('transform',`scale(${k}) translate(${-x},${-y})`);
  const tb=document.getElementById('turb'); if(tb) tb.setAttribute('seed',String(1+Math.floor(t/0.16)%4));
  const ms=(t-s.start)*1000;
  for(const an of document.getAnimations()){an.pause();an.currentTime=ms}
  return i;
}
window.renderAt=renderAt;
</script></body></html>
