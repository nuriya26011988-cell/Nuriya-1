<svg class="scn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="6-сахна: Үңгір өнерінің тууы"><style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Unbounded:wght@500;700&display=swap');
/* Scene animation kit — shared by every frame (also embedded in exported .svg files). */
.scn :is(.pop,.popb,.shiver,.shiver-hard,.bob,.flick,.fight,.dying,.rise,.rain,.blink,.flood,.wave,.drift,.carve,.fall,.gest,.cycle,.orbit,.counter,.sunrays,.ripple,.gust,.billow,.raise,.drain,.sway,.nod,.partL,.partR,.march){transform-box:fill-box}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,1.6s) ease-in-out var(--w,0s) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein var(--d,.8s) ease var(--w,0s) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1) var(--w,0s) both;transform-origin:50% 50%}
.popb{animation:pop .6s cubic-bezier(.3,1.5,.5,1) var(--w,0s) both;transform-origin:50% 100%}
@keyframes shiver{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
.shiver{animation:shiver .18s linear infinite}
.shiver-hard{animation:shiver .08s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--a,-6px))}}
.bob{animation:bob var(--d,1.2s) ease-in-out var(--w,0s) infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(3deg)}50%{transform:scale(1.05,.93) skewX(-2deg)}75%{transform:scale(.97,1.05) skewX(2deg)}}
.flick{animation:flick var(--d,.5s) ease-in-out var(--w,0s) infinite;transform-origin:50% 100%}
@keyframes struggle{0%{transform:skewX(-10deg) scale(.8,.75)}100%{transform:skewX(-24deg) scale(.62,.5)}}
.fight{animation:struggle .32s ease-in-out 0s 8 alternate,flick .5s ease-in-out 2.7s infinite;transform-origin:50% 100%}
@keyframes dying{from{transform:scale(1)}to{transform:scale(.4,.32)}}
.dying{animation:dying 7s ease-in 1s both;transform-origin:50% 100%}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.85}100%{transform:translate(var(--x,10px),-150px) scale(1.4);opacity:0}}
.rise{animation:rise var(--d,3s) ease-out var(--w,0s) infinite both;transform-origin:50% 100%}
@keyframes rainfall{from{transform:translate(0,0)}to{transform:translate(-300px,1080px)}}
.rain{animation:rainfall var(--d,.7s) linear infinite}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
.glow{animation:glow var(--d,1.6s) ease-in-out var(--w,0s) infinite}
@keyframes blink{0%,46%,52%,100%{transform:scaleY(1)}49%{transform:scaleY(.1)}}
.blink{animation:blink 3.4s infinite;transform-origin:50% 50%}
@keyframes floodup{from{transform:translateY(0)}to{transform:translateY(-270px)}}
.flood{animation:floodup 6s ease-in-out 2s both}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.wave{animation:wave 1.4s linear infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--a,-80px))}}
.drift{animation:drift var(--d,10s) ease-in-out infinite}
@keyframes carve{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
.carve{animation:carve .62s ease-in-out infinite;transform-origin:0 0}
@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--x,-10px),var(--y,80px));opacity:0}}
.fall{animation:fall var(--d,1.4s) ease-in var(--w,0s) infinite both}
@keyframes gest{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r,-22deg))}}
.gest{animation:gest var(--d,1.1s) ease-in-out var(--w,0s) infinite}
@keyframes cycle{0%{opacity:0;transform:scale(.6)}4%,18%{opacity:1;transform:scale(1)}22%,100%{opacity:0;transform:scale(.85)}}
.cycle{animation:cycle 10s ease var(--w,0s) infinite both;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
.orbit{animation:spin 40s linear infinite;transform-origin:50% 50%}
.counter{animation:unspin 40s linear infinite;transform-origin:50% 50%}
.sunrays{animation:spin 30s linear infinite;transform-origin:50% 50%}
@keyframes wash{0%,25%{opacity:1}100%{opacity:0}}
.wash{animation:wash 5s ease-in var(--w,0s) both}
@keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.ripple{animation:ripple 1.6s ease-out var(--w,0s) infinite both;transform-origin:50% 50%}
@keyframes gust{0%{transform:translateX(-120px);opacity:0}25%{opacity:.9}100%{transform:translateX(520px);opacity:0}}
.gust{animation:gust var(--d,1.8s) ease-in var(--w,0s) infinite both}
@keyframes billow{0%,100%{transform:skewY(0) scale(1)}50%{transform:skewY(-2.5deg) scale(.985,1.02)}}
.billow{animation:billow .9s ease-in-out infinite;transform-origin:100% 0}
@keyframes raise{from{transform:rotate(28deg) translateY(60px)}to{transform:rotate(0) translateY(0)}}
.raise{animation:raise 1.4s cubic-bezier(.3,1.2,.5,1) .6s both;transform-origin:100% 0}
@keyframes flow{to{stroke-dashoffset:-72}}
.flow{stroke-dasharray:22 14;animation:flow .9s linear infinite}
@keyframes drain{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
.drain{animation:drain 5s ease-in .8s both;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r,-3deg))}}
.sway{animation:sway var(--d,1.6s) ease-in-out infinite;transform-origin:0 100%}
@keyframes nod{0%,60%,100%{transform:rotate(0) translateY(0)}70%{transform:rotate(4deg) translateY(10px)}80%{transform:rotate(0) translateY(0)}88%{transform:rotate(3deg) translateY(7px)}}
.nod{animation:nod 3.6s ease-in-out 1s infinite;transform-origin:50% 100%}
@keyframes partL{to{transform:translateX(-420px)}}
@keyframes partR{to{transform:translateX(420px)}}
.partL{animation:partL 4s ease-in-out .4s both}
.partR{animation:partR 4s ease-in-out .4s both}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(-90px)}}
.march{animation:march 2.6s linear infinite}
@media (prefers-reduced-motion: reduce){
  .scn *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
