<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@900&family=PT+Sans:wght@700&display=swap">
<link rel="stylesheet" href="kit.css">
<style>html,body{margin:0;background:#000}svg{display:block;width:1280px;height:720px}</style></head>
<body><div id="out"></div>
<script src="kit.js"></script><script src="shots.js"></script><script src="style.js"></script><script src="moon.js"></script>
<script>
/* Moon video covers: big outlined title left, big hero in helmet right. */
const TF="Montserrat, 'Arial Black', sans-serif";
const line=(t,x,y,size,fill,rot=-3)=>`<text data-k="txt" x="${x}" y="${y}" font-family="${TF}" font-weight="900" font-size="${size}" fill="${fill}" stroke="#000" stroke-width="${size*.16}" paint-order="stroke" stroke-linejoin="round" transform="rotate(${rot} ${x} ${y})" style="filter:drop-shadow(6px 8px 0 rgba(0,0,0,.55))">${t}</text>`;
const openMouth=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-60,0 C-60,-70 60,-70 60,0 C60,70 -60,70 -60,0Z" fill="#3b1212" stroke="#161616" stroke-width="14"/><path d="M-36,40 C-20,14 20,14 36,40 C20,52 -20,52 -36,40Z" fill="#e2574c"/><path d="M-42,-34 H42" stroke="#fff" stroke-width="13" stroke-linecap="round"/></g>`;
const drop=(x,y,s=1)=>`<path d="M${x},${y} q-${22*s},${40*s} 0,${52*s} q${22*s},-${12*s} 0,-${52*s}Z" fill="#6ec3ff" stroke="#000" stroke-width="${5*s}"/>`;
const C1=()=>space(4)+earth(1580,300,260)+moonGround(820,4)+lander(380,940,.55)+
  astro(1480,1460,2.1,{arms:'up',mood:'scared',look:[0,0],big:1})+openMouth(1480,1460-410*2.1+105*2.1*.45,1.05)+drop(1160,420,1.3)+drop(1800,560,1.1)+
  '<!--T-->'+line('ЕГЕР СЕН АЙДА',70,250,120,'#fff')+line('24 САҒАТ',70,430,190,'#ffcf3f')+line('ӨМІР СҮРСЕҢ?',70,600,120,'#ff3b30');
const C2=()=>space(6)+moonGround(780,6)+`<rect width="1920" height="1080" fill="#e5483b" opacity=".22"/>`+earth(880,150,85)+
  G(astro(0,0,1.75,{arms:'up',pose:'jump',mood:'scared',big:1}),{t:'translate(1560,1290)'})+openMouth(1560,1290-410*1.75+105*1.75*.45,.95)+
  `<g transform="translate(1180,120) rotate(-4)"><rect width="640" height="120" rx="20" fill="#e5483b" stroke="#000" stroke-width="8"/><text x="320" y="88" font-family="${TF}" font-weight="900" font-size="74" fill="#fff" text-anchor="middle">ОТТЕГІ 30%</text></g>`+
  '<!--T-->'+line('АЙДА',70,330,210,'#fff')+line('24 САҒАТ',70,540,190,'#ffcf3f')+line('ТІРІ ҚАЛАСЫҢ БА?',70,700,96,'#fff');
const C3=()=>space(9)+earth(1560,330,300)+moonGround(830,9)+rocket(330,1000,.38)+
  astro(1330,1430,2.05,{arms:'wave',mood:'happy',look:[-.05,0]})+
  '<!--T-->'+line('АЙДАҒЫ',70,300,170,'#fff')+line('1 КҮНІМ',70,500,180,'#ffcf3f')+line('Байқоңырдан ұштым!',70,650,72,'#fff');
window.make=i=>{const [bg,tx]=[C1,C2,C3][i]().split('<!--T-->');document.getElementById('out').innerHTML=`<svg class="scn" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${DEFS2}${bg}${vignette(.4)}${tx}</svg>`;
  const sv=document.querySelector('svg');sv.pauseAnimations();sv.setCurrentTime(0);for(const a of document.getAnimations()){a.pause();a.currentTime=2500}};
</script></body></html>
